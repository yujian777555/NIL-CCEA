name: Phase 0C tests

on:
  push:
    branches: [main, phase0b-adapter-statistical-corrections]
  pull_request:
    branches: [main, phase0a-literature-environment-audit]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run no-API unit tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pydantic
          PYTHONPATH=src python -m unittest discover -s tests -v
